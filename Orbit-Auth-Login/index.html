<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitAuth | Mission Control Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="orbit-wrapper">

        <!-- MAC THEME CONTROLS -->
        <div class="window-controls">
            <div class="dot red" onclick="setTheme('')" title="Supernova Red"></div>
            <div class="dot yellow" onclick="setTheme('theme-blue')" title="Nebula Blue"></div>
            <div class="dot green" onclick="setTheme('theme-green')" title="Toxic Green"></div>
        </div>

        <div class="orbit-card">
            <!-- LEFT SIDE: THE WORMHOLE -->
            <div class="visual-side">
                <div class="space-bg"></div>

                <div class="wormhole-container" id="wormholeTrigger">
                    <div class="accretion-disk"></div>
                    <div class="event-horizon">
                        <div class="core-glow"></div>
                    </div>
                    <div class="particle p1"></div>
                    <div class="particle p2"></div>
                    <div class="particle p3"></div>
                </div>

                <div class="hint-text">Initialize Sequence</div>
            </div>

            <!-- RIGHT SIDE: FORM -->
            <div class="form-side" id="formSide">
                <div class="dark-overlay" id="darkOverlay"></div>

                <div class="form-content">
                    <div class="form-header">
                        <h1>System Access</h1>
                        <p>Enter your credentials to connect to the mainframe.</p>
                    </div>

                    <form onsubmit="event.preventDefault(); alert('Access Granted. Welcome to Orbit. (Demo)');">
                        <div class="input-group">
                            <label>Operator ID / Email</label>
                            <input type="email" placeholder="commander@orbit.net" required />
                        </div>

                        <div class="input-group">
                            <label>Access Code</label>
                            <input type="password" id="passwordInput" placeholder="••••••••" required />
                            <span class="password-toggle" onclick="togglePassword()">👁️</span>
                        </div>

                        <div class="form-options">
                            <a href="#" class="forgot-password">Reset Access Code?</a>
                        </div>

                        <button type="submit" class="btn-primary">
                            <span class="btn-text">Engage</span>
                            <span class="btn-arrow">↗</span>
                        </button>
                    </form>

                    <div class="divider"><span class="divider-text">OR AUTHENTICATE VIA</span></div>

                    <div class="social-buttons">
                        <button class="btn-social" type="button">Google</button>
                        <button class="btn-social" type="button">GitHub</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
