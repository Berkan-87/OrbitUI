<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitAuth Bundle | Preview Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #0a0a0f;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #05050a 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }

        p {
            color: #8888aa;
            margin-bottom: 50px;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid #2a2a40;
            border-radius: 16px;
            padding: 40px 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.1);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 13px;
            margin-bottom: 0;
            color: #8888aa;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #ff3333);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>OrbitAuth Bundle</h1>
        <p>Explore the Ultimate Space UI Kit. Select a component to view the live demo.</p>

        <div class="grid">
            <a href="Orbit-Auth-Login/index.html" class="card">
                <div class="icon">🌌</div>
                <h2>Login</h2>
                <p>Wormhole animation</p>
            </a>

            <a href="Orbit-Auth-Register/index.html" class="card">
                <div class="icon">🚀</div>
                <h2>Register</h2>
                <p>Access level meter</p>
            </a>

            <a href="404 Edition/index.html" class="card">
                <div class="icon">🕳️</div>
                <h2>404 Error</h2>
                <p>Broken orbit restore</p>
            </a>

            <a href="OrbitAuth-Pricing/index.html" class="card">
                <div class="icon">🪐</div>
                <h2>Pricing</h2>
                <p>Orbital glowing cards</p>
            </a>

            <a href="OrbitAuth-Profile/index.html" class="card">
                <div class="icon">👨‍🚀</div>
                <h2>Profile & Settings</h2>
                <p>Dark/Light mode toggle</p>
            </a>
        </div>
    </div>
</body>

</html>
